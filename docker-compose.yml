# mesh — Self-Hosting Docker Compose
#
# Quick start:
#   cp .env.example .env   # fill in your values
#   docker compose up -d
#
# With built-in LiveKit (local dev / no LiveKit Cloud account):
#   docker compose --profile livekit up -d
#
# With Cloudflare Tunnel (auto-HTTPS, no port forwarding needed):
#   docker compose --profile cloudflare up -d
#
# With Polls & Whiteboard activities:
#   docker compose --profile microapps up -d
#
# Combine profiles as needed:
#   docker compose --profile livekit --profile cloudflare --profile microapps up -d

services:
  # ── mesh frontend (nginx + static SPA) ─────────────────────────────────
  mesh:
    image: ghcr.io/davifernan/mesh:latest
    ports:
      - '${MESH_PORT:-80}:80'
    environment:
      MESH_HOMESERVER: '${MESH_HOMESERVER}'
      MESH_LIVEKIT_URL: '${MESH_LIVEKIT_URL}'
      MESH_PRESENCE_URL: '${MESH_PRESENCE_URL}'
      MESH_VOICE_STATE_MODE: '${MESH_VOICE_STATE_MODE:-livekit}'
      MESH_AUTHORITATIVE_BRIDGE_MODE: '${MESH_AUTHORITATIVE_BRIDGE_MODE:-false}'
      MESH_ALLOW_CUSTOM_HOMESERVERS: '${MESH_ALLOW_CUSTOM_HOMESERVERS:-true}'
      MESH_TOKEN_STORAGE_MODE: '${MESH_TOKEN_STORAGE_MODE:-encrypted-local}'
      BRIDGE_AUTH_SECRET: '${BRIDGE_AUTH_SECRET:-}'
      MESH_POLLS_URL: '${MESH_POLLS_URL:-}'
      MESH_WHITEBOARD_URL: '${MESH_WHITEBOARD_URL:-}'
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - mesh
    restart: unless-stopped

  # ── Presence bridge (Bun + Hono) ───────────────────────────────────────
  bridge:
    image: ghcr.io/davifernan/mesh-bridge:latest
    environment:
      LIVEKIT_API_KEY: '${LIVEKIT_API_KEY}'
      LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET}'
      LIVEKIT_URL: '${LIVEKIT_URL:-}'
      PORT: '3001'
      BRIDGE_VOICE_STATE_AUTHORITATIVE: '${BRIDGE_VOICE_STATE_AUTHORITATIVE:-false}'
      BRIDGE_ALLOWED_ORIGINS: '${BRIDGE_ALLOWED_ORIGINS:-}'
      BRIDGE_AUTH_SECRET: '${BRIDGE_AUTH_SECRET:-}'
      REDIS_URL: '${REDIS_URL:-redis://redis:6379}'
    ports:
      - '127.0.0.1:3002:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      mesh:
      voicechat:
        aliases:
          - bridge
    restart: unless-stopped

  # ── Redis (voice state persistence) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - mesh
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  # ── LiveKit SFU (optional — local dev / self-hosted) ───────────────────
  #
  # Use this when you don't have a LiveKit Cloud account.
  # Pre-configured dev keys work out of the box with the .env.example defaults.
  # For production, replace keys and configure your domain in contrib/livekit/.
  #
  # Start: docker compose --profile livekit up -d
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml --dev
    ports:
      - '${LIVEKIT_PORT:-7880}:7880'
      - '7881:7881/tcp'
      - '7882:7882/udp'
    volumes:
      - ./contrib/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    networks:
      - mesh
    profiles:
      - livekit
    restart: unless-stopped

  # ── Cloudflare Tunnel (optional — auto-HTTPS, no port forwarding) ──────
  #
  # Exposes mesh securely via Cloudflare without opening ports on your server.
  # Get a tunnel token: dash.cloudflare.com → Zero Trust → Networks → Tunnels
  #
  # Start: docker compose --profile cloudflare up -d
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - mesh
    profiles:
      - cloudflare
    restart: unless-stopped

  # ── Polls widget (optional) ────────────────────────────────────────────
  polls-widget:
    image: ghcr.io/nordeck/matrix-poll-widget:latest
    restart: unless-stopped
    ports:
      - '${POLLS_HOST_PORT:-3003}:8080'
    environment:
      REACT_APP_HOME_SERVER_URL: '${MESH_HOMESERVER:-https://matrix.org}'
    networks:
      - mesh
    profiles:
      - microapps

  # ── Whiteboard widget (optional) ───────────────────────────────────────
  neoboard-widget:
    image: ghcr.io/nordeck/matrix-neoboard-widget:latest
    restart: unless-stopped
    ports:
      - '${WHITEBOARD_HOST_PORT:-3004}:8080'
    networks:
      - mesh
    profiles:
      - microapps

networks:
  mesh:
    name: mesh
  voicechat:
    external: true

volumes:
  redis_data:

version: '3.9'

services:
  # ── mesh frontend (nginx + static SPA) ─────────────────────────────────
  mesh:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${MESH_PORT:-80}:80'
    environment:
      MESH_HOMESERVER: '${MESH_HOMESERVER}'
      MESH_LIVEKIT_URL: '${MESH_LIVEKIT_URL}'
      MESH_PRESENCE_URL: '${MESH_PRESENCE_URL}'
      # Controls how the frontend resolves participant presence.
      # "bridge" = bridge is authoritative (recommended for production).
      # "livekit" = prefer live LiveKit client state (default for local dev).
      MESH_VOICE_STATE_MODE: '${MESH_VOICE_STATE_MODE:-livekit}'
      MESH_AUTHORITATIVE_BRIDGE_MODE: '${MESH_AUTHORITATIVE_BRIDGE_MODE:-false}'
      # Optional: set these to show Polls/Whiteboard in the Activities catalog.
      # Must be publicly reachable URLs (loaded by users' browsers, not the container).
      MESH_POLLS_URL: '${MESH_POLLS_URL:-}'
      MESH_WHITEBOARD_URL: '${MESH_WHITEBOARD_URL:-}'
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - mesh
    restart: unless-stopped

  # ── Presence bridge (Bun + Hono) ──────────────────────────────────────────────
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    environment:
      LIVEKIT_API_KEY: '${LIVEKIT_API_KEY}'
      LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET}'
      LIVEKIT_URL: '${LIVEKIT_URL:-}'
      PORT: '3001'
      # Feature flag: when "true" the bridge is the authoritative source of truth
      # for voice state. Enables stricter consistency guarantees and Redis-backed
      # state persistence (requires REDIS_URL when set to "true").
      BRIDGE_VOICE_STATE_AUTHORITATIVE: '${BRIDGE_VOICE_STATE_AUTHORITATIVE:-false}'
      # Redis connection URL for persistent voice state across bridge restarts.
      # Required when BRIDGE_VOICE_STATE_AUTHORITATIVE=true in production.
      # Leave empty to use in-memory state only (safe for local dev / single-instance).
      REDIS_URL: '${REDIS_URL:-}'
    ports:
      - '127.0.0.1:3002:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mesh
      - voicechat
    restart: unless-stopped

  # ── Redis (optional — voice state persistence) ───────────────────────────────
  #
  # Enables persistent voice state across bridge restarts and supports
  # multi-instance bridge deployments (horizontal scaling).
  #
  # Setup:
  #   1. Start with: docker compose --profile redis up -d redis
  #   2. Set REDIS_URL=redis://redis:6379 and BRIDGE_VOICE_STATE_AUTHORITATIVE=true in .env
  #   3. Restart the bridge: docker compose restart bridge
  #
  # The bridge falls back to in-memory state when REDIS_URL is unset — safe for
  # single-instance local dev without this service running.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - mesh
    profiles:
      - redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  polls-widget:
    # nordeck/matrix-poll-widget — self-hosted polls for mesh rooms.
    #
    # Setup (server admin):
    #   1. Start with: docker compose --profile microapps up -d polls-widget
    #   2. Expose port 3001 via your reverse proxy as a public URL,
    #      e.g. https://polls.your-domain.com
    #   3. Set MESH_POLLS_URL=https://polls.your-domain.com in your .env
    #      and restart the mesh container so config-microapps.js is regenerated.
    #   4. Polls will now appear in the mesh Activities catalog (🚀 button in call view).
    #
    # CORS: the nordeck image allows all origins by default, no extra config needed.
    image: ghcr.io/nordeck/matrix-poll-widget:latest
    restart: unless-stopped
    ports:
      - "${POLLS_HOST_PORT:-3001}:8080"
    environment:
      REACT_APP_HOME_SERVER_URL: '${MESH_HOMESERVER:-https://matrix.org}'
    networks:
      - mesh
    profiles:
      - microapps

  neoboard-widget:
    # nordeck/matrix-neoboard-widget — collaborative whiteboard for mesh rooms.
    #
    # Setup (server admin):
    #   1. Start with: docker compose --profile microapps up -d neoboard-widget
    #   2. Expose port 3003 via your reverse proxy as a public URL,
    #      e.g. https://whiteboard.your-domain.com
    #   3. Set MESH_WHITEBOARD_URL=https://whiteboard.your-domain.com in your .env
    #      and restart the mesh container so config-microapps.js is regenerated.
    #   4. Whiteboard will now appear in the mesh Activities catalog (🚀 button).
    #
    # Note: nordeck/matrix-neoboard stores whiteboard state as Matrix room events.
    # Ensure your homeserver has reasonable rate limits for state events.
    # Port 3003 (3002 is reserved for the bridge service on the host).
    image: ghcr.io/nordeck/matrix-neoboard-widget:latest
    restart: unless-stopped
    ports:
      - "${WHITEBOARD_HOST_PORT:-3003}:8080"
    networks:
      - mesh
    profiles:
      - microapps

networks:
  mesh:
    name: mesh
  voicechat:
    name: voicechat
    external: true

volumes:
  redis_data:

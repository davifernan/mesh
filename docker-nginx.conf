server {
  listen 80;
  listen [::]:80;

  location = /config.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
  }

  # ── Presence bridge proxy ──────────────────────────────────────────────────
  # Forwards /api/presence/* → bridge:3001/presence/*
  # SSE-specific settings: disable buffering, long read timeout.
  location /api/presence/ {
    proxy_pass         http://bridge:3001/presence/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;

    # SSE / streaming: must NOT buffer the response
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;   # keep SSE connection open for up to 1 hour
    proxy_send_timeout 3600s;

    # Required for SSE to work through nginx
    add_header         X-Accel-Buffering no;
  }

  location / {
    root /usr/share/nginx/html;

    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;
    rewrite ^/assets/(.*)$ /assets/$1 break;
    rewrite ^/sound/(.*)$ /sound/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}

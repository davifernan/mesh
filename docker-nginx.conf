server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  location = /config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  location = /config-microapps.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    default_type application/javascript;
    try_files $uri =404;
  }

  location /api/presence/ {
    proxy_pass         http://bridge:3001/presence/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header         X-Accel-Buffering no;
  }

  location /sound/ {
    types { audio/mpeg mp3; }
    default_type audio/mpeg;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Cross-Origin-Resource-Policy "cross-origin";
    try_files $uri =404;
  }

  # Microapp entry points — serve their own HTML, not index.html
  location ~ ^/(youtube|spotify|polls|whiteboard|widget)\.html$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

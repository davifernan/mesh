name: Electron Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    name: Build Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ── Web-app build ──────────────────────────────────────────────────
      - name: Install web-app dependencies
        run: npm ci

      - name: Build web-app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build

      # ── Desktop build + publish to GitHub Release ──────────────────────
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Compile Electron main/preload
        working-directory: desktop
        run: node scripts/build.mjs

      - name: Build & publish Electron app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --config electron-builder.config.cjs --publish always

name: Electron Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    name: Build Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # ── Web-app build ──────────────────────────────────────────────────
      - name: Install web-app dependencies
        run: npm ci

      - name: Build web-app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build

      # ── Desktop build + publish to GitHub Release ──────────────────────
      - name: Set desktop version from git tag
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
          echo "Desktop version set to $VERSION"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Compile Electron main/preload
        working-directory: desktop
        # No MESH_APP_URL needed — the web app is bundled from dist/ via extraResources.
        # Users enter their own Matrix homeserver in the login screen at first launch.
        run: node scripts/build.mjs

      - name: Build & publish Electron app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: davifernan
          GITHUB_REPO: mesh
        run: npx electron-builder --${{ matrix.platform }} --config electron-builder.config.cjs --publish always

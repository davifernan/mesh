<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hintergrund Farbverlauf (Hellblau zu Dunkelblau/Lila) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ea6ff" />
      <stop offset="40%" stop-color="#4a5ef8" />
      <stop offset="100%" stop-color="#24258b" />
    </linearGradient>

    <!-- 3D Schatten-Effekt (etwas kompakter und schärfer für einen cleanen Look) -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#070a3a" flood-opacity="0.45"/>
    </filter>

    <!-- 3D Kugel-Farbverlauf für die Knoten (sorgt für den plastischen Look ganz ohne Blur) -->
    <radialGradient id="nodeWhite" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f6ff" />
      <stop offset="100%" stop-color="#b6d0fa" />
    </radialGradient>
  </defs>

  <!-- App Icon Hintergrund (Abgerundetes Quadrat / Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="115" ry="115" fill="url(#bgGradient)" />

  <!-- Gruppe für das gesamte Netzwerk (mit scharfem Schatten) -->
  <g filter="url(#drop-shadow)">
    
    <!-- LINIEN - Komplett ohne Glow, 100% scharf -->
    <g stroke="#f0f6ff" stroke-width="22" stroke-linecap="round">
      <!-- Äußerer Ring -->
      <line x1="205" y1="115" x2="380" y2="155" />
      <line x1="380" y1="155" x2="380" y2="315" />
      <line x1="380" y1="315" x2="205" y2="385" />
      <line x1="205" y1="385" x2="110" y2="260" />
      <line x1="110" y1="260" x2="205" y2="115" />
      
      <!-- Verbindungen zur Mitte -->
      <line x1="205" y1="115" x2="256" y2="220" />
      <line x1="380" y1="155" x2="256" y2="220" />
      <line x1="380" y1="315" x2="256" y2="220" />
      <line x1="205" y1="385" x2="256" y2="220" />
      <line x1="110" y1="260" x2="256" y2="220" />
    </g>

    <!-- KNOTEN (Punkte) - Reines 3D-Shading durch Gradienten, kein Glow -->
    <circle cx="205" cy="115" r="30" fill="url(#nodeWhite)" />
    <circle cx="380" cy="155" r="30" fill="url(#nodeWhite)" />
    <circle cx="256" cy="220" r="32" fill="url(#nodeWhite)" /> <!-- Mitte -->
    <circle cx="380" cy="315" r="30" fill="url(#nodeWhite)" />
    <circle cx="205" cy="385" r="30" fill="url(#nodeWhite)" />
    <circle cx="110" cy="260" r="30" fill="url(#nodeWhite)" />
  </g>
</svg>
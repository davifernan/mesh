<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: full square for maskable safe-zone compliance -->
  <rect width="512" height="512" fill="#413CDD"/>
  <!-- Squircle inner area (30% radius for Fluxer look) -->
  <rect x="40" y="40" width="432" height="432" rx="130" ry="130" fill="#413CDD"/>
  <!-- BC text mark -->
  <text
    x="256"
    y="256"
    text-anchor="middle"
